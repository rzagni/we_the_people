mutation CreateSurvey(
    $id: String!
    $question: String!
    $status: SurveyStatus!
    $createdBy: String!
    $language: String
    $region: String
    $topic: String
) @auth(
    level: USER
    insecureReason: "POC: survey creation is temporarily allowed from authenticated clients while admin flows are not yet separated."
) {
    survey_insert(
        data: {
            id: $id
            question: $question
            status: $status
            createdBy: $createdBy
            language: $language
            region: $region
            topic: $topic
        }
    )
}

query GetSurveyById($id: String!) @auth(
    level: USER
    insecureReason: "POC: any signed-in user may read a survey by id from the mobile app."
) {
    surveys(where: { id: { eq: $id } }) {
        id
        question
        status
        createdBy
        language
        region
        topic
    }
}

query ListSurveys @auth(
    level: USER
    insecureReason: "POC: authenticated users may list surveys while the admin surface is still under construction."
) {
    surveys {
        id
        question
        status
        createdBy
        language
        region
        topic
    }
}

mutation RegisterUserDevice(
    $id: String!
    $fcmToken: String!
    $platform: DevicePlatform!
    $notificationsEnabled: Boolean!
) @auth(level: USER) {
    userDevice_upsert(
        data: {
            id: $id
            userId_expr: "auth.uid"
            fcmToken: $fcmToken
            platform: $platform
            notificationsEnabled: $notificationsEnabled
        }
    )
}

query ListMyUserDevices @auth(level: USER) {
    userDevices(where: { userId: { eq_expr: "auth.uid" } }) {
        id
        userId
        fcmToken
        platform
        notificationsEnabled
    }
}

mutation CreateSurveyDelivery(
    $id: String!
    $surveyId: String!
    $userId: String!
    $deviceId: String!
    $status: DeliveryStatus!
) @auth(
    level: USER
    insecureReason: "POC: survey deliveries are created from trusted manual flows before a dedicated admin backend is added."
) {
    surveyDelivery_insert(
        data: {
            id: $id
            surveyId: $surveyId
            userId: $userId
            deviceId: $deviceId
            status: $status
        }
    )
}

query ListSurveyResponsesBySurvey($surveyId: String!) @auth(
    level: USER
    insecureReason: "POC: authenticated users may inspect survey responses during early testing before admin-only access is enforced."
) {
    surveyResponses(where: { surveyId: { eq: $surveyId } }) {
        id
        surveyId
        userId
        deliveryId
        answer
    }
}

mutation MarkSurveyDeliveryOpened($deliveryId: String!) @auth(
    level: USER
    insecureReason: "POC: client updates delivery status by delivery id after opening a survey."
) {
    surveyDelivery_update(
        key: { id: $deliveryId }
        data: {
            status: OPENED
        }
    )
}

mutation SubmitSurveyResponse(
    $id: String!
    $surveyId: String!
    $deliveryId: String!
    $answer: SurveyAnswer!
) @auth(level: USER) {
    surveyResponse_insert(
        data: {
            id: $id
            surveyId: $surveyId
            deliveryId: $deliveryId
            userId_expr: "auth.uid"
            answer: $answer
        }
    )
}

mutation MarkSurveyDeliveryAnswered($deliveryId: String!) @auth(
    level: USER
    insecureReason: "POC: client updates delivery status by delivery id after submitting an answer."
) {
    surveyDelivery_update(
        key: { id: $deliveryId }
        data: {
            status: ANSWERED
        }
    )
}

query GetMySurveyResponseByDelivery($deliveryId: String!) @auth(level: USER) {
    surveyResponses(
        where: {
            deliveryId: { eq: $deliveryId }
            userId: { eq_expr: "auth.uid" }
        }
    ) {
        id
        surveyId
        userId
        deliveryId
        answer
    }
}